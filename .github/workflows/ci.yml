name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Forbidden changes guard (scope lock)
        id: forbidden_changes
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            app/services/llm_chat/orchestration_core/**
            app/services/llm_chat/chat_orchestration_parts/**
            app/services/llm_chat/chat_stream_orchestration_parts/**
            app/services/agent_execution/**
            app/services/agent_trace_logger.py
            app/services/agent_trace_logger/**
            app/services/agent_eyes/**
            app/middleware/**trace**
            app/middleware/**stream**

      - name: Fail on forbidden changes
        if: github.event_name == 'pull_request' && steps.forbidden_changes.outputs.any_changed == 'true'
        run: |
          echo "Forbidden scope files changed: ${{ steps.forbidden_changes.outputs.all_changed_files }}"
          exit 1
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit==3.7.1

      - name: Lint (pre-commit)
        run: |
          python -m pre_commit run --all-files --show-diff-on-failure --color=always

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libpq-dev
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist pytest-mock pytest-cov
      
      - name: Run unit tests
        run: |
          pytest tests -v --tb=short --cov=. --cov-report=xml --ignore=tests/integration --ignore=tests/e2e
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short
      
      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  release_gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libpq-dev
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist pytest-mock pytest-cov

      - name: release_gates
        shell: pwsh
        run: |
          ./scripts/ci/run_release_gates.ps1

      - name: Upload determinism report artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: determinism-report
          path: artifacts/determinism-report/
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      - name: Run bandit security linter
        run: bandit -c bandit.yaml -r ./app -q -lll
      - name: Check dependencies for vulnerabilities
        run: safety check

  build:
    needs: [lint, test, security, release_gates]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run smoke tests
        run: |
          python -c "from app.main import app; print('App imports successfully')"
          python -c "from utils.pdf_builder import build_pdf; print('PDF builder imports successfully')"
      
      - name: Create deployment artifact
        run: |
          mkdir -p artifacts
          zip -r artifacts/retirement-system-${{ github.sha }}.zip . \
            -x "*.git*" "*.pytest_cache*" "*__pycache__*" "*.coverage*" "test_*.db"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retirement-system-${{ github.sha }}
          path: artifacts/retirement-system-${{ github.sha }}.zip