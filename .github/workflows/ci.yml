name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Forbidden changes guard (scope lock)
        id: forbidden_changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            app/services/llm_chat/orchestration_core/**
            app/services/llm_chat/chat_orchestration_parts/**
            app/services/llm_chat/chat_stream_orchestration_parts/**
            app/services/agent_execution/**
            app/services/agent_trace_logger.py
            app/services/agent_trace_logger/**
            app/services/agent_eyes/**
            app/middleware/**trace**
            app/middleware/**stream**

      - name: Fail on forbidden changes
        if: steps.forbidden_changes.outputs.any_changed == 'true'
        run: |
          echo "Forbidden scope files changed: ${{ steps.forbidden_changes.outputs.all_changed_files }}"
          exit 1
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8
      - name: Get changed python files
        id: changed_py
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.py
      - name: Debug changed files
        run: |
          echo "any_changed=${{ steps.changed_py.outputs.any_changed }}"
          echo "all_changed_files=${{ steps.changed_py.outputs.all_changed_files }}"
      - name: Skip lint when no python files changed
        if: steps.changed_py.outputs.any_changed != 'true'
        run: echo "No Python files changed. Skipping lint."
      - name: Black (changed files)
        if: steps.changed_py.outputs.any_changed == 'true'
        run: python -m black --check --diff ${{ steps.changed_py.outputs.all_changed_files }}
      - name: Isort (changed files)
        if: steps.changed_py.outputs.any_changed == 'true'
        run: python -m isort --check-only ${{ steps.changed_py.outputs.all_changed_files }}
      - name: Flake8 (changed files)
        if: steps.changed_py.outputs.any_changed == 'true'
        run: python -m flake8 ${{ steps.changed_py.outputs.all_changed_files }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libpq-dev
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist pytest-mock pytest-cov
      
      - name: Run unit tests
        run: |
          pytest tests -v --tb=short --cov=. --cov-report=xml --ignore=tests/integration --ignore=tests/e2e

      - name: release_gates
        shell: pwsh
        run: |
          ./scripts/ci/run_release_gates.ps1
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short
      
      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      - name: Run bandit security linter
        run: bandit -c bandit.yaml -r ./app -q -lll
      - name: Check dependencies for vulnerabilities
        run: safety check

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run smoke tests
        run: |
          python -c "from app.main import app; print('App imports successfully')"
          python -c "from utils.pdf_builder import build_pdf; print('PDF builder imports successfully')"
      
      - name: Create deployment artifact
        run: |
          mkdir -p artifacts
          zip -r artifacts/retirement-system-${{ github.sha }}.zip . \
            -x "*.git*" "*.pytest_cache*" "*__pycache__*" "*.coverage*" "test_*.db"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retirement-system-${{ github.sha }}
          path: artifacts/retirement-system-${{ github.sha }}.zip