<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Eyes – Trace Viewer</title>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;
    --accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;
    --orange:#f0883e;--cyan:#39d2c0;--font:system-ui,-apple-system,sans-serif;--mono:'SF Mono',Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;display:flex;height:100vh;overflow:hidden}
  a{color:var(--accent);text-decoration:none}
  #sidebar{width:360px;min-width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
  #sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
  #sidebar-header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  #sidebar-header h1 span{font-size:22px}
  .controls{display:flex;gap:8px;align-items:center}
  .controls input,.controls select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;flex:1}
  .controls button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;white-space:nowrap}
  .controls button:hover{opacity:.85}
  .controls button.danger{background:var(--red)}
  #trace-list{flex:1;overflow-y:auto}
  .trace-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
  .trace-item:hover,.trace-item.active{background:var(--bg)}
  .trace-item .tid{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
  .trace-item .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:12px}
  .trace-item .badge{display:inline-block;background:var(--border);border-radius:10px;padding:1px 8px;font-size:11px}
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  #main-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #main-header .trace-title{font-family:var(--mono);font-size:13px;color:var(--accent)}
  #timeline{flex:1;overflow-y:auto;padding:20px}
  .event-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
  .event-card .ev-header{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .event-card .ev-header:hover{background:rgba(255,255,255,.03)}
  .ev-type{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:4px;letter-spacing:.5px}
  .ev-type.user_input{background:#1a3a2a;color:var(--green)}
  .ev-type.llm_request_prepared{background:#1a2a3a;color:var(--cyan)}
  .ev-type.tool_call{background:#2a2a1a;color:var(--yellow)}
  .ev-type.tool_result{background:#2a1a2a;color:var(--purple)}
  .ev-type.assistant_output{background:#1a2a2a;color:var(--accent)}
  .ev-type.error{background:#3a1a1a;color:var(--red)}
  .ev-type.llm_response_raw{background:#1a1a2a;color:var(--orange)}
  .ev-time{font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:auto}
  .ev-body{display:none;border-top:1px solid var(--border);padding:12px 14px;max-height:500px;overflow:auto}
  .ev-body.open{display:block}
  .ev-body pre{font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .empty-state{display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);font-size:15px;flex-direction:column;gap:8px}
  .empty-state span{font-size:40px}
  .dot-line{position:relative;padding-left:28px}
  .dot-line::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
  .dot-line::after{content:'';position:absolute;left:4px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
  .dot-line.user_input::after{background:var(--green)}
  .dot-line.llm_request_prepared::after{background:var(--cyan)}
  .dot-line.tool_call::after{background:var(--yellow)}
  .dot-line.tool_result::after{background:var(--purple)}
  .dot-line.assistant_output::after{background:var(--accent)}
  .dot-line.error::after{background:var(--red)}
  #status{font-size:12px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--border);text-align:center}
  @media(max-width:768px){#sidebar{width:100%;max-height:40vh}body{flex-direction:column}#main{min-height:60vh}}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1><span>&#x1F441;</span> Agent Eyes</h1>
    <div class="controls">
      <input id="filter-client" type="number" placeholder="Client ID" style="max-width:100px">
      <button onclick="loadTraces()">Refresh</button>
      <button class="danger" onclick="purgeAll()">Purge</button>
    </div>
  </div>
  <div id="trace-list"></div>
  <div id="status">Ready</div>
</div>

<div id="main">
  <div id="main-header">
    <strong>Trace:</strong> <span class="trace-title" id="current-trace">Select a trace from the sidebar</span>
  </div>
  <div id="timeline">
    <div class="empty-state"><span>&#x1F441;</span>Select a trace to view its timeline</div>
  </div>
</div>

<script>
const API = '/api/v1/debug/agent-traces';
const adminToken = new URLSearchParams(location.search).get('token') || '';

function headers() {
  const h = {'Content-Type':'application/json'};
  if (adminToken) h['X-Admin-Token'] = adminToken;
  return h;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3});
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB') + ' ' + fmtTime(iso);
}

async function loadTraces() {
  const cid = document.getElementById('filter-client').value;
  let url = API + '?limit=100';
  if (cid) url += '&client_id=' + cid;
  document.getElementById('status').textContent = 'Loading...';
  try {
    const res = await fetch(url, {headers: headers()});
    if (!res.ok) { document.getElementById('status').textContent = 'Error: ' + res.status; return; }
    const data = await res.json();
    renderTraceList(data.traces || []);
    document.getElementById('status').textContent = data.count + ' traces loaded';
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}

function renderTraceList(traces) {
  const el = document.getElementById('trace-list');
  if (!traces.length) { el.innerHTML = '<div class="empty-state"><span>&#x1F4ED;</span>No traces found</div>'; return; }
  el.innerHTML = traces.map(t => `
    <div class="trace-item" onclick="loadTrace('${t.trace_id}')" data-tid="${t.trace_id}">
      <div class="tid">${t.trace_id}</div>
      <div class="meta">
        <span>${fmtDate(t.started_at)}</span>
        <span class="badge">${t.event_count} events</span>
        ${t.client_id ? '<span>Client #'+t.client_id+'</span>' : ''}
        ${t.endpoint ? '<span>'+t.endpoint.split('/').pop()+'</span>' : ''}
      </div>
    </div>
  `).join('');
}

async function loadTrace(traceId) {
  document.querySelectorAll('.trace-item').forEach(el => el.classList.toggle('active', el.dataset.tid === traceId));
  document.getElementById('current-trace').textContent = traceId;
  const tl = document.getElementById('timeline');
  tl.innerHTML = '<div class="empty-state">Loading...</div>';
  try {
    const res = await fetch(API + '/' + traceId, {headers: headers()});
    if (!res.ok) { tl.innerHTML = '<div class="empty-state">Error: '+res.status+'</div>'; return; }
    const data = await res.json();
    renderTimeline(data.events || []);
  } catch(e) {
    tl.innerHTML = '<div class="empty-state">Error: '+e.message+'</div>';
  }
}

function syntaxHighlight(json) {
  if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
  json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return json.replace(
    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    function(m){
      let c='color:#f0883e';
      if(/^"/.test(m)){c=/:\s*$/.test(m)?'color:#79c0ff':'color:#a5d6ff';}
      else if(/true|false/.test(m))c='color:#ff7b72';
      else if(/null/.test(m))c='color:#8b949e';
      return '<span style="'+c+'">'+m+'</span>';
    });
}

function renderTimeline(events) {
  const tl = document.getElementById('timeline');
  if (!events.length) { tl.innerHTML = '<div class="empty-state"><span>&#x1F4ED;</span>No events in this trace</div>'; return; }
  tl.innerHTML = events.map((ev, i) => {
    let payloadHtml = '';
    if (ev.payload) {
      try { payloadHtml = syntaxHighlight(JSON.stringify(ev.payload, null, 2)); }
      catch(e) { payloadHtml = String(ev.payload); }
    }
    if (ev.payload_text) payloadHtml += '\n\n--- payload_text ---\n' + ev.payload_text;
    return `
      <div class="dot-line ${ev.event_type}">
        <div class="event-card">
          <div class="ev-header" onclick="this.nextElementSibling.classList.toggle('open')">
            <span class="ev-type ${ev.event_type}">${ev.event_type}</span>
            ${ev.payload && ev.payload.tool_name ? '<span style="color:var(--yellow);font-size:12px">'+ev.payload.tool_name+'</span>':''}
            ${ev.payload && ev.payload.user_message ? '<span style="color:var(--muted);font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block">"'+escHtml(ev.payload.user_message.substring(0,80))+'"</span>':''}
            <span class="ev-time">${fmtTime(ev.created_at)}</span>
          </div>
          <div class="ev-body"><pre>${payloadHtml || '<em style="color:var(--muted)">No payload</em>'}</pre></div>
        </div>
      </div>`;
  }).join('');
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function purgeAll() {
  if (!confirm('Delete ALL trace events?')) return;
  try {
    await fetch(API, {method:'DELETE', headers: headers()});
    loadTraces();
    document.getElementById('timeline').innerHTML = '<div class="empty-state"><span>&#x1F441;</span>All traces purged</div>';
    document.getElementById('current-trace').textContent = 'Select a trace';
  } catch(e) { alert('Purge failed: '+e.message); }
}

loadTraces();
setInterval(loadTraces, 30000);
</script>
</body>
</html>
